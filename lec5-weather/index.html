<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>気象庁天気予報アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>天気予報アプリ</h1>

    <section>
        <label for="area-select">地域を選択してください：</label>
        <select id="area-select">
            <option value="">-- 地域を選択 --</option>
        </select>
    </section>

    <hr>

    <div id="weather-report">
        <h2 id="area-name">地域を選択すると予報が表示されます</h2>
        <div id="forecast-container"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
